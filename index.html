        if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; }
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { return false; }
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; }
        if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; }
      }

  <body>
    <div id="root"></div>
    <div id="error-overlay" style="position:fixed; z-index:9999; top:0; left:0; width:100%; background:rgba(0,0,0,0.8); color:red; padding:20px; display:none; font-family:monospace; pointer-events:none;"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var overlay = document.getElementById('error-overlay');
        overlay.style.display = 'block';
        overlay.innerHTML += '<br>' + message + ' at ' + source + ':' + lineno + ':' + colno;
      };
      window.onunhandledrejection = function(event) {
        var overlay = document.getElementById('error-overlay');
        overlay.style.display = 'block';
        overlay.innerHTML += '<br>Unhandled Promise: ' + event.reason;
      };
    </script>
